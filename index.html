<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline Demo</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        /* background: #f4efe7; */
        color: #1a1a1a;
        font-family: Georgia, "Times New Roman", serif;
      }
      body {
        display: grid;
        grid-template-rows: minmax(320px, 1fr) 120px minmax(160px, auto);
      }
      #map {
        min-height: 320px;
      }
      #timeline {
        min-height: 120px;
        position: relative;
      }
      #log {
        margin: 0;
        padding: 12px 16px;
        background: #111;
        color: #f0f0f0;
        font-size: 12px;
        line-height: 1.5;
        display: none;
      }
      .tl__labels {
        box-sizing: border-box;
        border-top: 1px solid #3f352b;
        border-bottom: 1px solid #3f352b;
      }
      .tl__divider {
        border-left: 1px dashed rgba(63, 53, 43, 0.45);
      }
      .voyage-marker {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #b43124;
        border: 3px solid #fff7ed;
        box-shadow: 0 0 0 6px rgba(180, 49, 36, 0.2);
      }
      .timeline-center-indicator {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }
      .timeline-center-indicator__line {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 0;
        border-left: 2px solid rgba(180, 49, 36, 0.85);
        box-shadow: 0 0 0 1px rgba(255, 247, 237, 0.85);
        transform: translateX(-50%);
      }
      .timeline-center-indicator__label {
        position: absolute;
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(16, 16, 16, 0.9);
        color: #fff6e8;
        font-size: 12px;
        letter-spacing: 0.03em;
        white-space: nowrap;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      }
    </style>
    <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>
    <div id="timeline"></div>
    <pre><code id="log"></code></pre>
    <script type="module" src="dist/index.umd.js"></script>
    <script type="module" src="src/roman-empire-polygon-demo.js"></script>
  </body>
</html>
